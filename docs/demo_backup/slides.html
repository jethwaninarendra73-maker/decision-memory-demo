<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo backup slides</title>
<!--
  Offline fallback for the five-minute demo: one frame per slide, always under the
  synthetic-data label. Open this file in any browser; it loads nothing from the network.
  Keys: right arrow or space = next, left arrow = back, Home = first, F = full screen.
-->
<style>
  :root {
    --bg: #ffffff;
    --text: #1f2933;
    --muted: #52606d;
    --label-bg: #fff4ce;
    --label-text: #7a4b00;
    --label-border: #f0c36d;
    --frame-border: #d9dee3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418;
      --text: #e4e7eb;
      --muted: #9aa5b1;
      --label-bg: #3b2f12;
      --label-text: #ffd98a;
      --label-border: #7a5c1c;
      --frame-border: #323a44;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  .label {
    flex: none;
    margin: 12px 16px 0;
    padding: 10px 14px;
    border: 1px solid var(--label-border);
    border-radius: 6px;
    background: var(--label-bg);
    color: var(--label-text);
    font-weight: 700;
    text-align: center;
  }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 16px;
  }
  main img {
    max-width: 100%;
    max-height: 100%;
    border: 1px solid var(--frame-border);
    border-radius: 4px;
  }
  footer {
    flex: none;
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px 14px;
    flex-wrap: wrap;
  }
  .caption { font-size: 18px; }
  .caption .step { font-weight: 700; }
  .nav { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  button {
    font: inherit;
    padding: 6px 12px;
    border: 1px solid var(--frame-border);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<div class="label" role="note">SYNTHETIC DATA — NOT A PREDICTION OR AUTHORIZED BUSINESS DECISION · fictional data, advisory only</div>
<main><img id="frame" alt=""></main>
<footer>
  <div class="caption"><span class="step" id="step"></span> · <span id="what"></span></div>
  <div class="nav">
    <button id="prev" type="button" aria-label="Previous frame">◀ Back</button>
    <span id="count"></span>
    <button id="next" type="button" aria-label="Next frame">Next ▶</button>
  </div>
</footer>
<script>
  // Frames in demo order. Each one is shown under the synthetic-data label above.
  const FRAMES = [
    ["01-hook.jpg", "1. Hook", "Three scattered artifacts: SRC-006, SRC-014, SRC-002"],
    ["02-capture-card.jpg", "2. Capture", "The extracted decision card, with confidence and evidence offsets"],
    ["03-ask-live-checks.jpg", "3. Ask", "Cited precedents, the failed one as a warning, a lesson from another region"],
    ["04-ask-failed-precedent.jpg", "3. Ask", "The failed Germany 6% precedent, shown as a warning with its score"],
    ["05-analyze-impact.jpg", "4. Analyze", "Contract-customer exclusion ticked; labelled impact items"],
    ["06-analyze-scenarios.jpg", "4. Analyze", "+3% / +5% / +7% with the formulas and the guardrail"],
    ["07-recommend-card.jpg", "5. Recommend", "Advisory recommendation: phased pilot at +5%, with cited reasons"],
    ["08-recommend-options.jpg", "5. Recommend", "+7% excluded by the guardrail; +3% lower uplift"],
    ["09-close-the-loop.jpg", "6. Close the loop", "Pilot PRO-001 completed; outcome OUT-015 written to memory"],
    ["10-outcome-in-memory.jpg", "6. Close the loop", "The pilot decision DEC-018 now ranked first, with its outcome"],
  ];
  let index = 0;
  const frame = document.getElementById("frame");
  function show(next) {
    index = Math.max(0, Math.min(FRAMES.length - 1, next));
    const [file, step, what] = FRAMES[index];
    frame.src = file;
    frame.alt = step + ": " + what;
    document.getElementById("step").textContent = step;
    document.getElementById("what").textContent = what;
    document.getElementById("count").textContent = (index + 1) + " / " + FRAMES.length;
    document.getElementById("prev").disabled = index === 0;
    document.getElementById("next").disabled = index === FRAMES.length - 1;
  }
  document.getElementById("prev").addEventListener("click", () => show(index - 1));
  document.getElementById("next").addEventListener("click", () => show(index + 1));
  document.addEventListener("keydown", (event) => {
    if (event.key === "ArrowRight" || event.key === " " || event.key === "PageDown") show(index + 1);
    else if (event.key === "ArrowLeft" || event.key === "PageUp") show(index - 1);
    else if (event.key === "Home") show(0);
    else if (event.key === "End") show(FRAMES.length - 1);
    else if (event.key === "f" || event.key === "F") {
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      } catch (err) { /* full screen is optional */ }
    } else return;
    event.preventDefault();
  });
  show(0);
</script>
</body>
</html>
