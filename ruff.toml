# Ruff settings. Ruff is optional tooling, not a dependency: install it in the venv
# with `pip install ruff` and run `ruff check .` / `ruff format --check .`.

line-length = 100
target-version = "py311"
src = ["src"]

[lint]
# app.py and scripts/ deliberately import after putting src/ on sys.path (marked noqa).
extend-select = ["E402"]

[lint.isort]
known-first-party = ["decision_memory"]
# Tests import shared helpers from tests/conftest.py (and a few test modules) as their own
# last import block.
known-local-folder = ["conftest", "test_brief", "test_capture_agent", "test_governance_agent", "test_ui_governance", "test_ui_guide", "test_ui_memory_graph", "test_ui_scenarios"]
