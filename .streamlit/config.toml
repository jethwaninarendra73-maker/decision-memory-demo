[browser]
# Offline-first: never phone home.
gatherUsageStats = false

[server]
# Local only: serve this machine, not the network. Setting a specific address also stops
# Streamlit's start-up banner from looking up this machine's network and public IP
# addresses (a UDP connect to 8.8.8.8 and, in headless mode, a request to
# checkip.amazonaws.com), so starting the app makes no outside call.
address = "localhost"
